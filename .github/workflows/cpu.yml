name: CPU
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tensor-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: docker build -f Dockerfile.smoke -t cannery-tensor-oracle-test .
      - run: >-
          CANNERY_ORACLE_TEST_IMAGE=cannery-tensor-oracle-test
          pytest -q tests/test_tensor_oracle_worker.py tests/test_oracle_worker.py

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: |
          python -m venv /tmp/cannery-wheel
          /tmp/cannery-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cannery-wheel/bin/python -c 'from cannery.api import create_app; assert create_app()'
          /tmp/cannery-wheel/bin/cannery --help

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/compose_acceptance.py

  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/reference_acceptance.py

  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/registration_acceptance.py

  submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/submission_acceptance.py

  numerical-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/numerical_ingress_acceptance.py

  benchmark-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/benchmark_acceptance.py

  publication-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: CANNERY_RELEASE_DOCKER=1 pytest -q tests/test_publication_docker.py

  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: CANNERY_BACKUP_DOCKER=1 pytest -q tests/test_backup_docker.py tests/test_shutdown_docker.py

  device-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: CANNERY_DEVICE_DOCKER=1 CANNERY_COMPOSE_REQUIRED=1 pytest -q tests/test_a3_compose.py tests/test_device_workers_docker.py

  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.38.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: CANNERY_AUTH_DOCKER=1 pytest -q tests/test_auth_docker.py

  hub-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Install reviewed client and server dependencies
        run: >-
          pip install '.[dev]' 'huggingface-hub==1.33.0'
          'git+https://github.com/huawei-cpl-zurich/cannery-kernels@ee29b27e65bb6cd5d0540bd092252c58d8a47848#subdirectory=kernels'
          'git+https://github.com/huawei-cpl-zurich/cannery-kernels@ee29b27e65bb6cd5d0540bd092252c58d8a47848#subdirectory=cannery-runtime'
      - run: CANNERY_HUB_DOCKER=1 CANNERY_HUB_CLIENT_PYTHON="$(command -v python)" pytest -q tests/test_hub_docker.py
