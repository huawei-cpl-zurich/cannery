x-app: &app
  build:
    context: .
    target: app
  environment:
    CANNERY_DATABASE_URL: postgresql+psycopg://cannery:cannery@postgres:5432/cannery
    CANNERY_REDIS_URL: redis://redis:6379/0
    CANNERY_DEV_IDENTITY_ENABLED: ${CANNERY_DEV_IDENTITY_ENABLED:-false}
    CANNERY_DEV_NAMESPACE: ${CANNERY_DEV_NAMESPACE:-team}
    CANNERY_DEV_ROLE: ${CANNERY_DEV_ROLE:-user}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
x-runtime: &runtime
  <<: *app
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  reference:
    build:
      context: .
      dockerfile: Dockerfile.smoke
    command: ["true"]
  registrar:
    <<: *runtime
    build:
      context: .
      target: registrar
    environment:
      CANNERY_DATABASE_URL: postgresql+psycopg://cannery:cannery@postgres:5432/cannery
      CANNERY_REDIS_URL: redis://redis:6379/0
      CANNERY_GIT_REMOTES: ${CANNERY_GIT_REMOTES:-[]}
      CANNERY_SNAPSHOT_ROOT: /var/lib/cannery/snapshots
      CANNERY_SMOKE_IMAGE: ${COMPOSE_PROJECT_NAME}-reference
    depends_on:
      migrate:
        condition: service_completed_successfully
      reference:
        condition: service_completed_successfully
    volumes:
      - git-snapshots:/var/lib/cannery/snapshots
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["dramatiq", "cannery.registration_worker", "--processes", "1", "--threads", "1"]
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cannery
      POSTGRES_PASSWORD: cannery
      POSTGRES_DB: cannery
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cannery -d cannery"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  reconciler:
    <<: *runtime
    command: ["python", "-m", "cannery.reconcile"]
  worker:
    <<: *runtime
    command: ["dramatiq", "cannery.worker", "--processes", "1", "--threads", "2"]
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      start_period: 5s
      retries: 12
    ports:
      - "127.0.0.1:${CANNERY_PORT:-8000}:8000"
    volumes:
      - git-snapshots:/var/lib/cannery/snapshots:ro
volumes:
  postgres-data:
  git-snapshots:
